<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yusef Ahmed — Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --surface: #111111;
      --border:  #1f1f1f;
      --text:    #e8e8e8;
      --muted:   #555;
      --accent:  #c8f542;
      --accent2: #42f5a7;
      --prompt:  #c8f542;
      --dim:     #333;
      --font:    'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    /*
      Single fluid base size: grows from 15px on small screens to 18px on wide.
      Everything else uses em so it scales together with no extra media queries.
    */
    html {
      font-size: clamp(15px, 1.1vw + 10px, 18px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 clamp(16px, 3vw, 32px);
    }

    header {
      padding: 1.5em 0 1em;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .site-title {
      font-size: 0.7em;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ── Output ── */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 1em 0 0.5em;
      scroll-behavior: smooth;
    }

    #output::-webkit-scrollbar { width: 3px; }
    #output::-webkit-scrollbar-track { background: transparent; }
    #output::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    .output-line {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .output-line.prompt-echo {
      color: var(--muted);
      margin-top: 0.8em;
    }
    .output-line.prompt-echo .pchar { color: var(--accent); }
    .output-line.error   { color: #f55; }
    .output-line.success { color: var(--accent2); }
    .output-line.accent  { color: var(--accent); }
    .output-line.dim     { color: var(--muted); }

    .output-section {
      margin: 0.35em 0 0.6em;
    }

    .output-section h2 {
      font-size: 0.7em;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35em;
    }

    .output-section p {
      font-size: 1em;
      color: #bbb;
      margin-bottom: 0.15em;
      max-width: 60ch;
    }

    .output-section a { color: var(--accent2); text-decoration: none; }
    .output-section a:hover { text-decoration: underline; }

    .kv-row {
      display: flex;
      gap: 1em;
      margin-bottom: 0.1em;
      align-items: baseline;
    }
    .kv-row .kv-key { color: var(--accent); min-width: 8em; font-size: 1em; }
    .kv-row .kv-val { color: #bbb; font-size: 1em; }

    .tag {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid var(--dim);
      border-radius: 2px;
      padding: 0.05em 0.4em;
      font-size: 0.85em;
      color: #aaa;
      margin: 0.1em 0.1em;
    }

    /* ── Input ── */
    #input-row {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.75em 0 1em;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .prompt-symbol {
      color: var(--prompt);
      font-size: 1em;
      flex-shrink: 0;
      user-select: none;
    }

    #input-wrap { flex: 1; position: relative; }

    #cmd-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 1em;
      caret-color: var(--accent);
      line-height: 1.5;
    }

    /* Autocomplete ghost text */
    #ghost {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      font-family: var(--font);
      font-size: 1em;
      line-height: 1.5;
      white-space: pre;
      color: transparent;
    }
    #ghost .ghost-typed { color: transparent; }
    #ghost .ghost-hint  { color: var(--dim); }

    /* Subtle scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- <header>
    <div class="site-title">YOUR NAME — v1.0</div>
  </header> -->

  <div id="output"></div>

  <div id="input-row">
    <span class="prompt-symbol">❯</span>
    <div id="input-wrap">
      <div id="ghost"><span class="ghost-typed"></span><span class="ghost-hint"></span></div>
      <input id="cmd-input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" autofocus
             placeholder="type a command…" />
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// CONFIGURATION — edit this object to customise the site
// ═══════════════════════════════════════════════════════
const CONFIG = {
  title: "Yusef Ahmed — v1.0",
  // Lines shown at the top on load, before the command list
  intro: [
    { type: "accent", text: "Yusef Ahmed / Pentesting Consultant" },
    { type: "dim",    text: "Type a command below. Tab to autocomplete." },
  ],

  commands: {

    about: {
      desc: "Who I am",
      run() {
        return section("ABOUT", `
          <p>Hey — I'm <span style="color:var(--accent)">Your Name</span>, a [designer / engineer / founder] based in [City].</p>
          <p>I'm currently working on [project or company]. Previously I was at [Company A] and [Company B].</p>
          <p>I care about [topic], [topic], and [topic].</p>
        `);
      }
    },

    work: {
      desc: "What I've built",
      run() {
        return section("WORK", `
          <div class="kv-row"><span class="kv-key">2024 – now</span><span class="kv-val">Project Alpha — short description</span></div>
          <div class="kv-row"><span class="kv-key">2022 – 2024</span><span class="kv-val">Project Beta — short description</span></div>
          <div class="kv-row"><span class="kv-key">2019 – 2022</span><span class="kv-val">Company Name — role</span></div>
          <div class="kv-row"><span class="kv-key">2016 – 2019</span><span class="kv-val">Company Name — role</span></div>
        `);
      }
    },

    writing: {
      desc: "Articles & essays",
      run() {
        return section("WRITING", `
          <div class="kv-row"><span class="kv-key">2025-06</span><span class="kv-val"><a href="#">Article Title One</a></span></div>
          <div class="kv-row"><span class="kv-key">2025-03</span><span class="kv-val"><a href="#">Article Title Two</a></span></div>
          <div class="kv-row"><span class="kv-key">2024-11</span><span class="kv-val"><a href="#">Article Title Three</a></span></div>
        `);
      }
    },

    stack: {
      desc: "Tools I use",
      run() {
        return section("STACK", `
          <div class="kv-row"><span class="kv-key">Languages</span><span class="kv-val">
            <span class="tag">TypeScript</span><span class="tag">Python</span><span class="tag">Rust</span>
          </span></div>
          <div class="kv-row"><span class="kv-key">Frontend</span><span class="kv-val">
            <span class="tag">React</span><span class="tag">Tailwind</span>
          </span></div>
          <div class="kv-row"><span class="kv-key">Backend</span><span class="kv-val">
            <span class="tag">Node.js</span><span class="tag">Postgres</span><span class="tag">Redis</span>
          </span></div>
          <div class="kv-row"><span class="kv-key">Tools</span><span class="kv-val">
            <span class="tag">Neovim</span><span class="tag">Linear</span><span class="tag">Figma</span>
          </span></div>
        `);
      }
    },

    contact: {
      desc: "Get in touch",
      run() {
        return section("CONTACT", `
          <div class="kv-row"><span class="kv-key">Email</span><span class="kv-val"><a href="mailto:you@example.com">you@example.com</a></span></div>
          <div class="kv-row"><span class="kv-key">X / Twitter</span><span class="kv-val"><a href="https://x.com/yourhandle" target="_blank">@yourhandle</a></span></div>
          <div class="kv-row"><span class="kv-key">GitHub</span><span class="kv-val"><a href="https://github.com/yourhandle" target="_blank">github.com/yourhandle</a></span></div>
          <div class="kv-row"><span class="kv-key">LinkedIn</span><span class="kv-val"><a href="https://linkedin.com/in/yourhandle" target="_blank">linkedin.com/in/yourhandle</a></span></div>
        `);
      }
    },

    now: {
      desc: "What I'm doing now",
      run() {
        return section("NOW", `
          <p>Updated June 2025 — from Rotterdam.</p>
          <p>Currently focused on [what you're building]. Reading a lot about [topic]. Training for [hobby].</p>
        `);
      }
    },

    help: {
      desc: "All commands",
      run() {
        const rows = Object.entries(COMMANDS)
          .map(([name, cmd]) =>
            `<div class="kv-row"><span class="kv-key" style="color:var(--accent)">${name}</span><span class="kv-val">${cmd.desc}</span></div>`
          ).join('');
        return section("COMMANDS", rows);
      }
    },

    clear: {
      desc: "Clear the screen",
      run() { clearOutput(); return null; }
    },

  }
};
// ═══════════════════════════════════════════════════════

const COMMANDS = CONFIG.commands;

function section(title, inner) {
  return `<div class="output-section"><h2>${title}</h2>${inner}</div>`;
}
function appendOutput(html, cls = '') {
  const output = document.getElementById('output');
  const div = document.createElement('div');
  div.className = 'output-line ' + cls;
  if (html) div.innerHTML = html;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}
function clearOutput() { document.getElementById('output').innerHTML = ''; }
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Intro lines then auto-render the command list (single source of truth)
CONFIG.intro.forEach(line => appendOutput(line.text, line.type));
appendOutput(COMMANDS.help.run());

// History
let history = [];
let historyIndex = -1;

function handleCommand(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;

  appendOutput(`<span class="pchar">❯</span> ${escapeHtml(cmd)}`, 'prompt-echo');

  if (cmd === 'clear') {
    clearOutput();
    history.unshift(raw);
    historyIndex = -1;
    return;
  }

  if (COMMANDS[cmd]) {
    const result = COMMANDS[cmd].run();
    if (result) appendOutput(result);
  } else {
    appendOutput(`command not found: <strong>${escapeHtml(cmd)}</strong> — type 'help' to see available commands`, 'error');
  }

  history.unshift(raw);
  historyIndex = -1;
}

const input      = document.getElementById('cmd-input');
const ghostTyped = document.querySelector('#ghost .ghost-typed');
const ghostHint  = document.querySelector('#ghost .ghost-hint');

function updateGhost(val) {
  if (!val) { ghostTyped.textContent = ''; ghostHint.textContent = ''; return; }
  const match = Object.keys(COMMANDS).find(k => k.startsWith(val) && k !== val);
  ghostTyped.textContent = val;
  ghostHint.textContent  = match ? match.slice(val.length) : '';
}

input.addEventListener('input', () => updateGhost(input.value));

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    handleCommand(input.value);
    input.value = '';
    updateGhost('');

  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value;
    if (!val) return;
    const matches = Object.keys(COMMANDS).filter(k => k.startsWith(val));
    if (matches.length === 1) {
      input.value = matches[0];
      updateGhost('');
    } else if (matches.length > 1) {
      appendOutput(`<span class="pchar">❯</span> ${escapeHtml(val)}`, 'prompt-echo');
      appendOutput(matches.map(m => `<span style="color:var(--accent)">${m}</span>`).join('  '));
    }

  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex < history.length - 1) {
      historyIndex++;
      input.value = history[historyIndex];
      updateGhost('');
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    }

  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = history[historyIndex];
      updateGhost('');
    } else {
      historyIndex = -1;
      input.value = '';
      updateGhost('');
    }
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('a')) input.focus();
});
input.focus();
</script>
</body>
</html>
